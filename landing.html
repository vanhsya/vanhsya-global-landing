<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANHSYA GLOBAL - Coming Soon</title>
    <meta name="description" content="VANHSYA GLOBAL - Where cosmic elegance meets timeless beauty. Coming Soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0015;
            color: #f0e6ff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 80%, rgba(138, 43, 226, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(219, 39, 119, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(75, 0, 130, 0.2) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
        }

        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0015;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(138, 43, 226, 0.3);
            border-top: 3px solid #8a2be2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Header Animation */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            background: linear-gradient(45deg, #8a2be2, #db2777, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(219, 39, 119, 0.8)); }
        }

        .tagline {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #e9d5ff;
            font-weight: 300;
            letter-spacing: 0.2em;
            opacity: 0.8;
        }

        /* Countdown Timer */
        .countdown {
            display: flex;
            gap: 2rem;
            margin: 3rem 0;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
        }

        .countdown-item {
            text-align: center;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 1.5rem 1rem;
            min-width: 100px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3);
        }

        .countdown-number {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: #ffd700;
            display: block;
            margin-bottom: 0.5rem;
        }

        .countdown-label {
            font-size: 0.9rem;
            color: #e9d5ff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Email Form */
        .email-form {
            margin: 2rem 0;
            opacity: 0;
            animation: fadeInUp 1s ease 1.5s forwards;
        }

        .form-container {
            display: flex;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .email-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 50px;
            background: rgba(138, 43, 226, 0.1);
            color: #f0e6ff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .email-input::placeholder {
            color: rgba(240, 230, 255, 0.6);
        }

        .email-input:focus {
            border-color: #8a2be2;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .submit-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #8a2be2, #db2777);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            white-space: nowrap;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4);
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 1.5rem;
            margin: 2rem 0;
            opacity: 0;
            animation: fadeInUp 1s ease 2s forwards;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e9d5ff;
            text-decoration: none;
            transition: all 0.3s ease;
            background: rgba(138, 43, 226, 0.1);
        }

        .social-link:hover {
            transform: translateY(-3px) scale(1.1);
            border-color: #8a2be2;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4);
            color: #ffd700;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 400px;
            height: 4px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 2px;
            margin: 2rem 0;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 1s ease 2.5s forwards;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #db2777, #ffd700);
            border-radius: 2px;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 75%; }
            100% { width: 85%; }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .countdown {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .countdown-item {
                min-width: 80px;
                padding: 1rem 0.5rem;
            }

            .countdown-number {
                font-size: 2rem;
            }

            .form-container {
                flex-direction: column;
                width: 100%;
            }

            .container {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .brand-title {
                font-size: 2.5rem;
            }

            .countdown-item {
                min-width: 70px;
                padding: 0.8rem 0.3rem;
            }

            .countdown-number {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Animated Background -->
    <div class="bg-container"></div>
    
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Content -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="brand-title">VANHSYA GLOBAL</h1>
            <p class="tagline">COSMIC ELEGANCE REDEFINED</p>
        </header>

        <!-- Countdown Timer -->
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <!-- Email Subscription -->
        <form class="email-form" id="emailForm">
            <div class="form-container">
                <input type="email" class="email-input" placeholder="Enter your email for updates" required>
                <button type="submit" class="submit-btn">Notify Me</button>
            </div>
        </form>

        <!-- Progress Indicator -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="#" class="social-link" aria-label="Instagram">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

            <a href="#" class="social-link" aria-label="Twitter">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

            </a>

                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Loading Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1000);
        });

        // Particles Generation
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 30 : 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Countdown Timer
        function updateCountdown() {
            const targetDate = new Date('2024-12-31T23:59:59').getTime();
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            } else {
                document.getElementById('countdown').innerHTML = '<div class="countdown-item"><span class="countdown-number">🚀</span><span class="countdown-label">Launched!</span></div>';
            }
        }

        // Email Form
        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('.email-input').value;
            
            // Simple validation
            if (email) {
                // Here you would typically send the email to your backend
                alert('Thank you! We\'ll notify you when we launch.');
                this.querySelector('.email-input').value = '';
            }
        });

        // Initialize
        createParticles();
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Performance optimization
        if (window.innerWidth < 768) {
            document.querySelector('.bg-container').style.animation = 'none';
        }
    </script>
</body>
</html>
