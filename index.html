<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanhsya Beauty - Cosmic Elegance</title>
    <meta name="description" content="Vanhsya Global - Where cosmic elegance meets timeless beauty. Experience the universe within.">
    <meta name="keywords" content="beauty, cosmetics, luxury, cosmic, elegance, skincare">
    <meta property="og:title" content="Vanhsya Beauty - Cosmic Elegance">
    <meta property="og:description" content="Experience cosmic elegance redefined with Vanhsya Global beauty products.">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-base64@3.7.2/base64.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0c001f;
        color: #f0e6ff;
        overflow: hidden; /* Prevent body scroll, custom scroll on div */
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      .scroll-container::-webkit-scrollbar {
        width: 5px;
      }
      .scroll-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .scroll-container::-webkit-scrollbar-thumb {
        background: #8a2be2;
        border-radius: 10px;
      }

      /* --- NEW ANIMATIONS & STYLES --- */

      /* 1. Global Background Animation */
      @keyframes animate-background {
        0%{ background-position: 0% 50%; }
        50%{ background-position: 100% 50%; }
        100%{ background-position: 0% 50%; }
      }
      .animated-veil {
        background: linear-gradient(125deg, #0c001f, rgba(138, 43, 226, 0.2), rgba(12, 0, 31, 0.5), #0c001f);
        background-size: 400% 400%;
        animation: animate-background 15s ease infinite;
      }

      /* 2. Glowing Text Shadows */
      .section-title, .card-title {
        text-shadow: 0 0 8px rgba(218, 112, 214, 0.8), 0 0 16px rgba(138, 43, 226, 0.6), 0 0 32px rgba(255, 100, 0, 0.5);
      }
      .card-description {
         text-shadow: 0 0 5px rgba(218, 112, 214, 0.5);
      }
      
      /* 3. Animated Card Borders */
      @keyframes animated-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animated-card-border {
        background: linear-gradient(90deg, #8a2be2, #db2777, #8a2be2);
        background-size: 200% 200%;
        animation: animated-gradient 4s ease infinite;
        box-shadow: 0 0 15px rgba(138, 43, 226, 0.3), 0 0 25px rgba(218, 112, 214, 0.2);
        transition: box-shadow 0.3s ease;
      }
      .card-container {
        transition: transform 0.3s ease;
      }
      .card-container:hover {
        transform: translateY(-10px) scale(0.98);
      }
      .card-container:hover .animated-card-border {
        box-shadow: 0 0 25px rgba(138, 43, 226, 0.6), 0 0 40px rgba(218, 112, 214, 0.4);
      }
      
      /* 4. Scroll-triggered Reveal Animations */
      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: opacity, transform;
      }
      .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* --- ADDED FOR MIGRATION SECTION --- */
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 240s linear infinite;
      }
      
      /* --- ENHANCED MIGRATION GLOBE ANIMATIONS --- */
      @keyframes pulse-opacity {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .globe-line {
        animation: pulse-opacity 4s ease-in-out infinite;
      }
      .globe-line-2 {
        animation-delay: 1s;
      }
      .globe-line-3 {
        animation-delay: 2s;
      }
      .globe-line-4 {
        animation-delay: 3s;
      }

      /* --- PHOENIX ANIMATIONS --- */
      @keyframes float-phoenix {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-20px) scale(1.03); }
      }
      .phoenix-image {
        animation: float-phoenix 10s ease-in-out infinite;
        filter: drop-shadow(0 0 25px rgba(255, 120, 0, 0.6));
      }
      @keyframes sparkle-ember {
        0% { transform: translate(0, 0) scale(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(var(--tx, 0), var(--ty, -150px)) scale(1); opacity: 0; }
      }
      .ember {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #ffc700;
        border-radius: 50%;
        box-shadow: 0 0 10px #ffc700, 0 0 20px #ff8c00;
        animation: sparkle-ember 5s ease-out infinite;
        will-change: transform, opacity;
      }
      
      /* --- COUNTDOWN TIMER STYLES (ENHANCED) --- */
      .countdown-container {
        display: flex;
        gap: 1.5rem;
        margin-top: 2rem;
      }
      .countdown-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
        background: linear-gradient(160deg, rgba(46, 16, 79, 0.5), rgba(28, 9, 53, 0.3));
        border: 1px solid rgba(219, 39, 119, 0.4);
        border-radius: 1.5rem;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 20px rgba(219, 39, 119, 0.2), inset 0 0 10px rgba(219, 39, 119, 0.2);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .countdown-box:hover {
        transform: scale(1.08) translateY(-5px);
        box-shadow: 0 0 35px rgba(219, 39, 119, 0.5), inset 0 0 15px rgba(219, 39, 119, 0.3);
      }
      .countdown-number {
        font-family: 'Cinzel', serif;
        font-size: 3rem;
        font-weight: 700;
        line-height: 1;
        color: #fce7f3;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 15px rgba(219, 39, 119, 0.8), 0 0 25px rgba(219, 39, 119, 0.6);
      }
      .countdown-label {
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        color: #e9d5ff;
        opacity: 0.8;
        margin-top: 0.5rem;
        text-transform: uppercase;
      }

      /* --- COMING SOON MODAL STYLES (ENHANCED) --- */
      @keyframes fadeInModal {
          from { opacity: 0; }
          to { opacity: 1; }
      }
      @keyframes scaleUpModal {
          from { transform: scale(0.95) translateY(30px) rotateX(-10deg); opacity: 0; }
          to { transform: scale(1) translateY(0) rotateX(0deg); opacity: 1; }
      }
      .coming-soon-modal-overlay {
          position: fixed;
          inset: 0;
          background-color: rgba(12, 0, 31, 0.6);
          backdrop-filter: blur(12px);
          z-index: 100;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: fadeInModal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .coming-soon-modal-content {
          position: relative;
          background-image: linear-gradient(145deg, rgba(28, 9, 53, 0.9), rgba(46, 16, 79, 0.85)), url('https://images.pexels.com/photos/1169754/pexels-photo-1169754.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
          background-size: cover;
          background-position: center;
          border: 1px solid rgba(219, 39, 119, 0.5);
          border-radius: 1.5rem;
          padding: 3rem;
          max-width: 650px;
          width: 90%;
          color: #f0e6ff;
          box-shadow: 0 10px 50px rgba(138, 43, 226, 0.4);
          animation: scaleUpModal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          transform-origin: bottom;
          opacity: 0;
      }
      .modal-close-button {
          position: absolute;
          top: 1.5rem;
          right: 1.5rem;
          color: #f0e6ff;
          opacity: 0.7;
          transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .modal-close-button:hover {
          opacity: 1;
          transform: scale(1.1) rotate(90deg);
      }
      .modal-close-button svg {
          width: 1.75rem;
          height: 1.75rem;
      }
      .modal-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-family: 'Cinzel', serif;
        font-size: 1.5rem; /* Adjusted size */
        color: #fce7f3;
        margin-bottom: 1rem;
        text-shadow: 0 0 8px rgba(218, 112, 214, 0.8), 0 0 16px rgba(138, 43, 226, 0.6);
      }
      .modal-icon {
        width: 1.75rem;
        height: 1.75rem;
        color: #f472b6;
      }
      .modal-text {
        font-size: 1rem;
        line-height: 1.7;
        color: #e9d5ff;
      }

      /* --- FOOTER BUTTON --- */
      .footer-button {
        margin-top: 1rem;
        font-family: 'Cinzel', serif;
        background: transparent;
        border: 1px solid rgba(219, 39, 119, 0.6);
        color: #fce7f3;
        font-weight: bold;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        transform: perspective(1px) translateZ(0);
        position: relative;
        overflow: hidden;
        transition: color 0.3s;
      }
      .footer-button:before {
          content: "";
          position: absolute;
          z-index: -1;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: linear-gradient(45deg, #db2777, #8a2be2);
          transform: scaleX(0);
          transform-origin: 0 50%;
          transition: transform 0.4s ease-out;
      }
      .footer-button:hover {
          color: white;
      }
      .footer-button:hover:before {
          transform: scaleX(1);
      }

    </style>
